{% load static %}
{{ form.media}}
<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
        <img src="{% static 'logos/default.webp' %}" alt="Logo" class="w-32">
        <a href="{% url 'create_post' %}" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">+ Create Post</a>
    </header>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">{{ post.title }}</h1>

            {% if post.image %}
                <div class="mb-6">
                    <img src="{{ post.image.url }}" alt="Blog Image" class="rounded-lg shadow-md max-w-full h-auto">
                </div>
            {% endif %}

            <div class="prose max-w-none">
                <p class="text-gray-700 leading-relaxed">{{ post.body|safe }}</p>
            </div>

            <div class="mt-8">
                <a href="{% url 'home' %}" class="inline-flex items-center text-blue-600 hover:text-blue-800">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto px-4 py-8 mt-12 text-center border-t border-gray-200">
        <img src="{% static 'logos/default.webp' %}" alt="Logo" class="w-20 mx-auto mb-4">
        <p class="text-gray-600">&copy; {% now "Y" %} BlogX. All rights reserved.</p>
        
    </footer>
</body>
</html>
